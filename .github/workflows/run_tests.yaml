name: Test AMI
on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          activate-environment: build-conda-env
          channels: lcls-ii, conda-forge
          environment-file: .daq_20250402_r9.txt

      - name: Clone and Build LCLS2
        run: |
          git clone https://github.com/slac-lcls/lcls2.git
          cd lcls2
          # build_all.sh requires ENV_TYPE to be set before it will run at
          # all (normally done by sourcing setup_env.sh, which is S3DF/CDS
          # specific and won't work on a GitHub-hosted runner). "legacy" is
          # the same value setup_env.sh itself sets.
          # Deliberately NOT passing -d here: -d turns the DAQ build ON,
          # and this workflow only needs psana, so the DAQ build stays off.
          export ENV_TYPE=legacy
          ./build_all.sh
          cd ..

      - name: Build AMI
        run: |
          pip install .

      # - name: Install formatting tools
      #   run: |
      #     pip install black==24.2.0 isort==5.13.2 flake8 flake8-black

      # - name: Check formatting
      #   run: |
      #     black --check --line-length=120 .
      #     isort --check --profile=black --line-length=120 .
      #     flake8

      - name: Test AMI
        run: |
          export PYTEST_QT_API=pyside6
          export QT_API=pyside6
          xvfb-run pytest
